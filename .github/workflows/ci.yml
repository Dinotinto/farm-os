name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only; real values live in Vercel.
      DATABASE_URL: "file:./ci.db"
      SESSION_SECRET: "ci-only-session-secret-not-used-anywhere-real"
      FARM_USERS: "[]"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install (also generates the Prisma client)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
